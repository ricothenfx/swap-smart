<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Swap-Smart — when a dark store item is out of stock, the picker gets the best substitute in one tap. Explainable, hard-rule-guarded, proven by reproducible numbers."
    />
    <title>Swap-Smart — the one-tap substitution engine for dark stores</title>
    <script>
      // Apply theme before first paint to avoid FOUC
      (function () {
        try {
          var stored = localStorage.getItem("swap-smart-theme");
          var theme =
            stored ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
